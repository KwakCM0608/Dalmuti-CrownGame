<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#18070c" />
    <script>
      (() => {
        try {
          const stored = JSON.parse(
            localStorage.getItem("dalmuti.preferences.v1") || "null",
          );
          if (stored?.theme === "halloween") {
            document.documentElement.dataset.theme = "halloween";
            document.querySelector('meta[name="theme-color"]').content =
              "#09080c";
          }
        } catch {
          // Invalid or unavailable local preferences keep the original theme.
        }
      })();
    </script>
    <title>DALMUTI — 오프라인</title>
    <style>
      :root {
        --offline-text: #fff4d2;
        --offline-muted: rgba(255, 244, 210, 0.72);
        --offline-page:
          radial-gradient(circle at 50% 32%, #512331 0, transparent 42%),
          linear-gradient(145deg, #20090f, #100307);
        --offline-panel: rgba(27, 7, 12, 0.86);
        --offline-border: rgba(225, 185, 81, 0.42);
        --offline-crown-border: #d4ab4b;
        --offline-crown: url("/brand-dalmuti-crown.png");
        --offline-button-text: #281208;
        --offline-button-border: #f2d47c;
        --offline-button: linear-gradient(#f4d77f, #c48a30);
      }
      html[data-theme="halloween"] {
        --offline-text: #f7efe8;
        --offline-muted: rgba(226, 215, 224, 0.76);
        --offline-page:
          radial-gradient(circle at 18% 14%, rgba(104, 69, 127, 0.34), transparent 36%),
          radial-gradient(circle at 82% 82%, rgba(182, 91, 43, 0.19), transparent 32%),
          linear-gradient(145deg, #1c1922, #09080c 62%, #050507);
        --offline-panel: rgba(20, 18, 25, 0.9);
        --offline-border: rgba(203, 119, 71, 0.5);
        --offline-crown-border: #c87945;
        --offline-crown: url("/themes/halloween/crown.webp");
        --offline-button-text: #1b0d09;
        --offline-button-border: #f0aa6a;
        --offline-button: linear-gradient(#e6a15f, #9c4e2e);
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        color: var(--offline-text);
        background: var(--offline-page);
        font-family:
          Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, 100%);
        padding: 34px 26px;
        text-align: center;
        border: 1px solid var(--offline-border);
        border-radius: 28px;
        background: var(--offline-panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      }
      .offline-crown {
        display: block;
        width: 76px;
        height: 76px;
        margin: 0 auto;
        border: 2px solid var(--offline-crown-border);
        border-radius: 50%;
        background: #17131b var(--offline-crown) center / cover no-repeat;
      }
      h1 {
        margin: 18px 0 8px;
        font-family: Georgia, serif;
        font-size: 27px;
        letter-spacing: 0.2em;
      }
      p {
        margin: 0 0 24px;
        color: var(--offline-muted);
        font-size: 14px;
        line-height: 1.65;
      }
      button {
        min-width: 148px;
        min-height: 48px;
        color: var(--offline-button-text);
        border: 1px solid var(--offline-button-border);
        border-radius: 14px;
        background: var(--offline-button);
        font: inherit;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="offline-crown" aria-hidden="true"></span>
      <h1>DALMUTI</h1>
      <p>
        지금은 네트워크에 연결할 수 없습니다.<br />
        연결 상태를 확인한 뒤 다시 시도해 주세요.
      </p>
      <button type="button" onclick="location.reload()">다시 연결</button>
    </main>
  </body>
</html>
